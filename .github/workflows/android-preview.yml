name: Android preview (website unchanged)

on:
  push:
    branches: [codex/tih-native-android]
    paths: [android-app/**, .github/workflows/android-preview.yml, 'toefl-*.js', 'tools/toefl-*', 'cybersecurity-*.js', 'tools/cybersecurity-*', 'marketing-*.js', 'tools/marketing-*', 'sat-*.js', 'tools/sat-*', 'remotework-curriculum.js', 'remote-work-*.js', 'tools/remote-work-*', 'healthtech-*.js', 'tools/healthtech-*', 'data-*.js', 'tools/data-*', 'finlit-curriculum.js', 'financial-literacy-*.js', 'tools/financial-literacy-*', 'bible-*.js', 'tools/bible-school-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TIH_PREVIEW_KEYSTORE: ${{ github.workspace }}/android-app/.ci-preview-signing/preview.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          # Pin the command-line toolchain used for repeatable AVD creation.
          cmdline-tools-version: '13114758'
      # Reuse the SAME preview identity in validation and published APKs.
      # Never generate a replacement key when a cache has expired: that would
      # silently break updates and require learners to erase their local data.
      - uses: actions/cache/restore@v4
        with:
          path: android-app/.ci-preview-signing/preview.keystore
          key: tih-preview-signing-v2
          fail-on-cache-miss: true
      - name: Verify existing preview signing identity
        run: |
          test -s "$TIH_PREVIEW_KEYSTORE"
          keytool -list -keystore "$TIH_PREVIEW_KEYSTORE" -storepass android -alias androiddebugkey
          preview_fingerprint=$(keytool -exportcert -keystore "$TIH_PREVIEW_KEYSTORE" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f1)
          if [ "$preview_fingerprint" != "$(cat android-app/preview-signing.sha256)" ]; then
            echo 'Preview signing certificate changed; restore the original key.'
            exit 1
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Export and validate existing Learning Hub content
        run: |
          node android-app/tools/export-learning.mjs
          node --test android-app/tools/content.test.mjs
          node tools/check-courses-lite.js
          node android-app/tools/prepare-store.mjs
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-2 fonts-dejavu-core
          python3 android-app/tools/render-store.py
      - name: Check course quizzes and offline phone layouts
        run: |
          npm install --prefix "$RUNNER_TEMP/tih-toefl-browser" --no-package-lock playwright@1.51.1
          "$RUNNER_TEMP/tih-toefl-browser/node_modules/.bin/playwright" install --with-deps chromium
          python3 -m http.server 8099 > "$RUNNER_TEMP/toefl-http.log" 2>&1 &
          toefl_server_pid=$!
          trap 'kill "$toefl_server_pid"' EXIT
          export NODE_PATH="$RUNNER_TEMP/tih-toefl-browser/node_modules"
          node tools/toefl-browser.test.cjs
          node tools/toefl-reader.test.cjs
          node tools/cybersecurity-reader.test.cjs
          node tools/marketing-reader.test.cjs
          node tools/sat-reader.test.cjs
          node tools/remote-work-reader.test.cjs
          node tools/healthtech-reader.test.cjs
          node tools/data-reader.test.cjs
          node tools/financial-literacy-reader.test.cjs
          node tools/bible-school-reader.test.cjs
      - name: Build, unit-test, and lint Android preview
        working-directory: android-app
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Validate unsigned release and 16 KB native packaging
        run: python3 android-app/tools/validate-release.py
      - name: Verify learning and privacy screens on Android 16
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/tih-android
          ANDROID_AVD_HOME: ${{ runner.temp }}/tih-avd
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          sdkmanager --install 'system-images;android-36;default;x86_64' 'emulator'
          echo no | avdmanager create avd --name tih-api36 --package 'system-images;android-36;default;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/tih-api36.avd"
          test -f "$ANDROID_AVD_HOME/tih-api36.ini"
          node android-app/tools/emulator-smoke.mjs "$ANDROID_HOME" tih-api36 36
      - uses: actions/upload-artifact@v4
        with:
          name: TIH-Learning-Android-preview
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TIH-Learning-store-preparation
          path: android-app/release/output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TIH-Learning-unsigned-release-bundle
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation-reports
          path: |
            android-app/app/build/reports/
            android-app/app/src/main/assets/learning/manifest.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Financial-Literacy-phone-previews
          path: |
            test-results/financial-literacy/*.png
            android-app/app/build/reports/**/screenshots/*financialLiteracy*.png
            android-app/app/build/reports/**/screenshots/*financial-literacy*.png
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Bible-School-phone-previews
          path: |
            test-results/bible-school/*.png
            android-app/app/build/reports/**/screenshots/*bibleSchool*.png
            android-app/app/build/reports/**/screenshots/*bible-school*.png
          if-no-files-found: warn
