name: Android preview (website unchanged)

on:
  push:
    branches: [codex/tih-native-android]
    paths: [android-app/**, .github/workflows/android-preview.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          # Pin the command-line toolchain used for repeatable AVD creation.
          cmdline-tools-version: '13114758'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tih-preview-signing-v1
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Export and validate existing Learning Hub content
        run: |
          node android-app/tools/export-learning.mjs
          node --test android-app/tools/content.test.mjs
          node tools/check-courses-lite.js
          node android-app/tools/prepare-store.mjs
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends librsvg2-2 fonts-dejavu-core
          python3 android-app/tools/render-store.py
      - name: Build, unit-test, and lint Android preview
        working-directory: android-app
        run: ./gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug :app:lintRelease :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease
      - name: Validate unsigned release and 16 KB native packaging
        run: python3 android-app/tools/validate-release.py
      - name: Verify learning and privacy screens on Android 16
        env:
          ANDROID_USER_HOME: ${{ runner.temp }}/tih-android
          ANDROID_AVD_HOME: ${{ runner.temp }}/tih-avd
        run: |
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          sdkmanager --install 'system-images;android-36;default;x86_64' 'emulator'
          echo no | avdmanager create avd --name tih-api36 --package 'system-images;android-36;default;x86_64' --device pixel_6 --path "$ANDROID_AVD_HOME/tih-api36.avd"
          test -f "$ANDROID_AVD_HOME/tih-api36.ini"
          node android-app/tools/emulator-smoke.mjs "$ANDROID_HOME" tih-api36 36
      - uses: actions/upload-artifact@v4
        with:
          name: TIH-Learning-Android-preview
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TIH-Learning-store-preparation
          path: android-app/release/output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: TIH-Learning-unsigned-release-bundle
          path: |
            android-app/app/build/outputs/bundle/release/app-release.aab
            android-app/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-validation-reports
          path: |
            android-app/app/build/reports/
            android-app/app/src/main/assets/learning/manifest.json
