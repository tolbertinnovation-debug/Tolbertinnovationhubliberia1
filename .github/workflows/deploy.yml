name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate reviewed question banks and catalog
        run: |
          node --test tools/projectmgmt-quizzes.test.mjs tools/accounting-bookkeeping-quizzes.test.mjs tools/webdev-quizzes.test.mjs tools/design-quizzes.test.mjs tools/entrepreneurship-quizzes.test.mjs tools/android-kotlin-quizzes.test.mjs tools/office-quizzes.test.mjs tools/leadership-quizzes.test.mjs tools/grant-writing-quizzes.test.mjs tools/english-success-quizzes.test.mjs tools/ielts-quizzes.test.mjs
          node tools/check-courses-lite.js

      - name: Prepare public Android and Windows downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/prepare-app-downloads.py

      - name: Verify app store on mobile and desktop
        run: |
          npm install --prefix /tmp/libapps-check playwright
          google-chrome --version
          NODE_PATH=/tmp/libapps-check/node_modules node tools/libapps-store-check.cjs

      - name: Save app store previews
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: libapps-store-preview
          path: /tmp/libapps-preview
          if-no-files-found: ignore

      - name: Wait for automatic branch deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          url = 'https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs?head_sha=' + os.environ['GITHUB_SHA']
          for attempt in range(120):
              request = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'User-Agent': 'TIH-Pages'})
              with urllib.request.urlopen(request) as response:
                  runs = json.load(response)['workflow_runs']
              automatic = [run for run in runs if run['name'] == 'pages build and deployment']
              if automatic and all(run['status'] == 'completed' for run in automatic):
                  print('Automatic branch deployment finished; publishing complete app downloads afterward.')
                  break
              if not automatic and attempt >= 6:
                  print('No automatic branch deployment is configured.')
                  break
              time.sleep(5)
          else:
              raise RuntimeError('Automatic deployment did not finish; avoid replacing downloads out of order.')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
