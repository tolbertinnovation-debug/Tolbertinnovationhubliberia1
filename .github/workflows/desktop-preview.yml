name: TIH Desktop Windows preview
on:
  push:
    branches: [codex/tih-desktop-app]
    paths: ['desktop-app/**', '.github/workflows/desktop-preview.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run content
      - run: pip install Pillow
      - run: python tools/icon.py
      - run: npm test
      - name: Test the real Windows desktop app
        run: npm run test:ui
        env:
          TIH_ELECTRON_TEST: '1'
      - name: Build Windows installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check installer
        shell: pwsh
        run: |
          $installer = Get-Item dist/TIH-Learning-Desktop-0.7.0-Windows-x64.exe
          if ($installer.Length -lt 20000000) { throw 'Installer unexpectedly small' }
          Get-FileHash $installer -Algorithm SHA256 | Format-List
      - name: Install and test the packaged Windows app
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'tih-desktop-install'
          $installer = (Resolve-Path 'dist/TIH-Learning-Desktop-0.7.0-Windows-x64.exe').Path
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $env:TIH_PACKAGED_EXE = Join-Path $target 'TIH Learning Desktop.exe'
          if (!(Test-Path $env:TIH_PACKAGED_EXE)) { throw 'Installed application not found' }
          npm run test:ui
        env:
          TIH_ELECTRON_TEST: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TIH-Desktop-screens-and-tests
          path: desktop-app/test-results/
      - name: Publish desktop preview
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v0.7.0-preview
          target_commitish: ${{ github.sha }}
          name: TIH Learning Desktop 0.7.0 — Windows preview
          prerelease: true
          body_path: desktop-app/RELEASE-NOTES.md
          files: |
            desktop-app/dist/TIH-Learning-Desktop-0.7.0-Windows-x64.exe
            desktop-app/test-results/00-welcome-login.png
            desktop-app/test-results/13-continuous-reading.png
            desktop-app/test-results/01-dashboard.png
            desktop-app/test-results/06-learning-focus-1440.png
            desktop-app/test-results/07-video-classroom.png
            desktop-app/test-results/08-computer-literacy-assessment.png
            desktop-app/test-results/10-computer-literacy-progress.png
            desktop-app/test-results/11-ielts-chart-lesson.png
            desktop-app/test-results/12-ielts-writing-studio.png
            desktop-app/test-results/14-project-management-lesson.png
            desktop-app/test-results/15-project-management-assessment.png
            desktop-app/test-results/16-project-management-portfolio.png
            desktop-app/test-results/17-project-management-progress.png

            desktop-app/test-results/18-webdev-coding-lesson.png
            desktop-app/test-results/19-webdev-assessment.png
            desktop-app/test-results/20-webdev-capstone.png
            desktop-app/test-results/21-webdev-progress.png
            desktop-app/test-results/22-office-lesson.png
            desktop-app/test-results/23-office-assessment.png
            desktop-app/test-results/24-office-capstone.png
            desktop-app/test-results/25-office-progress.png
