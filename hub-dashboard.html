<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard | TIH Learning Hub</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;background:#0B1F3A;color:#e2e8f0}
.box{text-align:center;padding:2rem;max-width:420px}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#E31E24;border-radius:50%;margin:0 auto 1rem;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:#93c5fd}
.btn{display:inline-block;margin-top:1rem;background:#E31E24;color:#fff;font-weight:700;padding:.7rem 1.4rem;border-radius:999px;text-decoration:none;border:none;cursor:pointer;font-size:.95rem}
.btn2{display:inline-block;margin-top:.6rem;background:transparent;color:#93c5fd;border:1.5px solid rgba(147,197,253,.4);font-weight:600;padding:.55rem 1.1rem;border-radius:999px;text-decoration:none;font-size:.88rem}
#status{font-size:.85rem;color:#94a3b8;margin-top:.75rem}
</style>
</head>
<body>
<div class="box">
  <div class="spin" id="spin"></div>
  <p id="msg">Loading Learning Hub login…</p>
  <p id="status">Connecting…</p>
</div>
<script>
(function(){
  /* The full dashboard lives on jsDelivr (pinned commit). Local
     hub-dashboard.full.1–3.b64 parts are missing, so the old
     multi-part loader hung on slow networks. CDN-first fixes it. */
  var CDN = 'https://cdn.jsdelivr.net/gh/tolbertinnovation-debug/Tolbertinnovationhubliberia1@7ab3b7480583a6a026a7cd45aa1c7a041ed69552/hub-dashboard.html';
  var RAW = 'https://raw.githubusercontent.com/tolbertinnovation-debug/Tolbertinnovationhubliberia1/7ab3b7480583a6a026a7cd45aa1c7a041ed69552/hub-dashboard.html';
  var statusEl = document.getElementById('status');
  var msgEl = document.getElementById('msg');
  var spinEl = document.getElementById('spin');

  function setStatus(t) { if (statusEl) statusEl.textContent = t; }
  function writeHtml(html) {
    if (!html || html.length < 5000 || html.indexOf('Sign In') < 0) throw new Error('incomplete');
    document.open();
    document.write(html);
    document.close();
  }
  function fail(detail) {
    if (spinEl) spinEl.style.display = 'none';
    msgEl.innerHTML = 'Could not load the login page.' + (detail ? '<br><small style="color:#94a3b8">' + detail + '</small>' : '');
    setStatus('');
    var box = document.querySelector('.box');
    var a1 = document.createElement('a');
    a1.className = 'btn';
    a1.href = CDN;
    a1.textContent = 'Open login (direct link)';
    box.appendChild(a1);
    var a2 = document.createElement('a');
    a2.className = 'btn2';
    a2.href = 'learning-hub';
    a2.textContent = '← Back to Learning Hub';
    box.appendChild(a2);
    var a3 = document.createElement('button');
    a3.className = 'btn2';
    a3.type = 'button';
    a3.textContent = 'Try again';
    a3.onclick = function () { location.reload(); };
    box.appendChild(a3);
  }

  function fetchText(url, timeoutMs) {
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctrl) ctrl.abort(); }, timeoutMs || 12000);
    return fetch(url, { cache: 'no-store', mode: 'cors', signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        clearTimeout(timer);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.text();
      })
      .catch(function (e) {
        clearTimeout(timer);
        throw e;
      });
  }

  setStatus('Loading from CDN…');
  fetchText(CDN, 14000)
    .then(writeHtml)
    .catch(function () {
      setStatus('CDN slow — trying GitHub…');
      return fetchText(RAW, 14000).then(writeHtml);
    })
    .catch(function (e) {
      fail((e && e.message) ? e.message : 'network');
    });
})();
</script>
</body>
</html>
