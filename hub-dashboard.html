<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard | TIH Learning Hub</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Inter,system-ui,sans-serif;background:#0B1F3A;color:#e2e8f0}
.box{text-align:center;padding:2rem;max-width:420px}
.spin{width:36px;height:36px;border:3px solid rgba(255,255,255,.2);border-top-color:#E31E24;border-radius:50%;margin:0 auto 1rem;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
a{color:#93c5fd}
</style>
</head>
<body>
<div class="box"><div class="spin" id="spin"></div><p id="msg">Loading Learning Hub dashboard…</p></div>
<script>
(function(){
  var CDN='https://cdn.jsdelivr.net/gh/tolbertinnovation-debug/Tolbertinnovationhubliberia1@7ab3b7480583a6a026a7cd45aa1c7a041ed69552/hub-dashboard.html';
  var PARTS=17;
  function fail(m){var s=document.getElementById('spin');if(s)s.style.display='none';document.getElementById('msg').innerHTML=(m||'Could not load.')+' <a href="'+CDN+'">Open dashboard</a>';}
  function writeHtml(html){document.open();document.write(html);document.close();}
  function loadCdn(){return fetch(CDN,{cache:'no-store',mode:'cors'}).then(function(r){if(!r.ok)throw new Error('CDN');return r.text();}).then(writeHtml);}
  function loadPayload(){
    return Promise.all(Array.from({length:PARTS},function(_,i){
      return fetch('hub-dashboard.p'+i+'.b64?v=3',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('p'+i);return r.text();});
    })).then(function(parts){
      var b64=parts.join('').replace(/\s+/g,'');
      if(b64.length<1000)throw new Error('short');
      var bin=atob(b64),bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
      if(typeof DecompressionStream==='undefined')throw new Error('browser');
      return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
    }).then(function(buf){writeHtml(new TextDecoder().decode(buf));});
  }
  loadPayload().catch(function(){return loadCdn();}).catch(function(e){fail(e&&e.message);});
})();
</script>
</body>
</html>
