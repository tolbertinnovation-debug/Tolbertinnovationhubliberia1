<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Dashboard | TIH Learning Hub</title>
</head>
<body>
<p style="font-family:system-ui;text-align:center;margin-top:3rem;color:#64748b">Loading dashboard…</p>
<script src="hub-dashboard.chunk.0.js?v=1"></script>
<script src="hub-dashboard.chunk.1.js?v=1"></script>
<script src="hub-dashboard.chunk.2.js?v=1"></script>
<script src="hub-dashboard.chunk.3.js?v=1"></script>
<script src="hub-dashboard.chunk.4.js?v=1"></script>
<script src="hub-dashboard.chunk.5.js?v=1"></script>
<script src="hub-dashboard.chunk.6.js?v=1"></script>
<script src="hub-dashboard.chunk.7.js?v=1"></script>
<script>
(function(){
  var c = window.TIH_HD_CHUNKS || [];
  var html = '';
  for (var i = 0; i < c.length; i++) {
    if (typeof c[i] !== 'string') { document.body.innerHTML = '<p style="color:red;text-align:center;margin-top:3rem">Dashboard failed to load (missing chunk ' + i + ').</p>'; return; }
    html += c[i];
  }
  document.open();
  document.write(html);
  document.close();
})();
</script>
</body>
</html>
