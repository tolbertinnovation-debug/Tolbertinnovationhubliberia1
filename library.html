<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TIH Digital Library — Loading…</title>
<style>body{font-family:system-ui;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;background:#0f172a;color:#e2e8f0} .box{text-align:center} .spin{width:40px;height:40px;border:3px solid #334155;border-top-color:#38bdf8;border-radius:50%;animation:s 0.8s linear infinite;margin:0 auto 1rem}@keyframes s{to{transform:rotate(360deg)}}</style>
</head>
<body>
<div class="box"><div class="spin"></div><p>Loading TIH Digital Library…</p></div>
<script src="library-b64-p1.js"></script>
<script src="library-b64-p2.js"></script>
<script src="library-b64-p3.js"></script>
<script src="library-b64-p4.js"></script>
<script src="library-b64-p5.js"></script>
<script src="library-b64-p6.js"></script>
<script src="library-b64-p7.js"></script>
<script src="library-b64-p8.js"></script>
<script src="library-b64-p9.js"></script>
<script src="library-b64-p10.js"></script>
<script>
(function(){
  var parts = window.__LIB_B64_PARTS || [];
  if(parts.length < 10){ document.body.innerHTML = "<p>Error loading library parts ("+parts.length+"/10). Please hard-refresh.</p>"; return; }
  var b64 = parts.join("");
  try {
    var bin = atob(b64);
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var html = new TextDecoder("utf-8").decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.body.innerHTML = "<p>Failed to decode library: "+e.message+"</p>";
  }
})();
</script>
</body>
</html>
