<script>
(function(){
  var parts = window.__LIB_B64_PARTS || [];
  if(parts.length < 20){
    document.body.textContent = "Library loading… please refresh once.";
    return;
  }
  try {
    var bin = atob(parts.join(""));
    var bytes = new Uint8Array(bin.length);
    for(var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
    var html = new TextDecoder("utf-8").decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch(e) {
    document.body.textContent = "Failed to load library: " + e.message;
  }
})();
</script>
