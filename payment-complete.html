<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment • TIH Learning Hub</title>
  <style>
    :root { --navy:#002868; --navy2:#0a337e; --blue:#1553b8; --red:#E31E24; --ink:#0f172a; --mut:#5b6b83; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink);
      background:linear-gradient(135deg,#eaf1ff,#f6f9ff); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:#fff; max-width:520px; width:100%; border-radius:20px; padding:40px 34px;
      box-shadow:0 24px 60px rgba(0,40,104,.18); text-align:center; }
    .emblem { width:78px; height:78px; border-radius:50%; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; font-size:38px; }
    .ok { background:linear-gradient(135deg,#16a34a,#0d8a3f); color:#fff; }
    .wait { background:linear-gradient(135deg,var(--blue),var(--navy)); color:#fff; }
    .bad { background:linear-gradient(135deg,#b91c1c,#7f1010); color:#fff; }
    h1 { font-size:1.5rem; margin:.2em 0 .3em; color:var(--navy); }
    p { color:var(--mut); line-height:1.6; margin:.4em 0; }
    .ref { font-family:ui-monospace,monospace; background:#f1f5ff; color:var(--navy); padding:6px 12px; border-radius:8px; display:inline-block; margin-top:6px; font-size:.85rem; }
    .btn { display:inline-block; margin-top:22px; background:linear-gradient(135deg,var(--red),#b71419); color:#fff; text-decoration:none;
      font-weight:700; padding:14px 26px; border-radius:12px; border:none; cursor:pointer; font-size:1rem; box-shadow:0 8px 20px rgba(227,30,36,.28); }
    .btn.alt { background:linear-gradient(135deg,var(--blue),var(--navy)); box-shadow:0 8px 20px rgba(0,40,104,.28); }
    .spin { width:22px; height:22px; border:3px solid rgba(255,255,255,.4); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite; }
    @keyframes sp { to { transform:rotate(360deg); } }
    .small { font-size:.85rem; margin-top:16px; }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="emblem wait" id="emblem"><div class="spin"></div></div>
    <h1 id="title">Confirming your payment…</h1>
    <p id="msg">Please wait a moment while we confirm your payment and unlock your course.</p>
    <div id="refBox"></div>
    <div id="actions"></div>
    <p class="small" id="note"></p>
  </div>

  <script src="hub-config.js?v=4"></script>
  <script src="hub-cloud.js?v=16"></script>
  <script src="hub-db.js?v=37"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var status = (q.get('status') || '').toLowerCase();
      var txRef = q.get('tx_ref') || '';
      var pending = {};
      try { pending = JSON.parse(sessionStorage.getItem('tih_pay_pending') || '{}'); } catch (e) {}
      var itemId = pending.itemId || q.get('item_id') || '';

      var emblem = document.getElementById('emblem');
      var title = document.getElementById('title');
      var msg = document.getElementById('msg');
      var actions = document.getElementById('actions');
      var refBox = document.getElementById('refBox');
      var note = document.getElementById('note');

      if (txRef) refBox.innerHTML = '<div class="ref">Ref: ' + txRef.replace(/[<>&]/g, '') + '</div>';

      function dashLink() {
        return '<a class="btn" href="hub-dashboard.html">Go to My Courses →</a>';
      }
      function courseLink() {
        if (itemId) return '<a class="btn" href="course-player.html?course=' + encodeURIComponent(itemId) + '">Start Learning →</a>';
        return dashLink();
      }

      function showSuccess() {
        emblem.className = 'emblem ok'; emblem.innerHTML = '✓';
        title.textContent = 'Payment successful!';
        msg.textContent = 'Thank you. Your course has been unlocked. You can start learning right away.';
        actions.innerHTML = courseLink() + ' <a class="btn alt" href="hub-dashboard.html">My Dashboard</a>';
      }
      function showPending() {
        emblem.className = 'emblem wait'; emblem.innerHTML = '⏳';
        title.textContent = 'Payment received — unlocking…';
        msg.textContent = 'Your payment went through. Access usually unlocks within a minute. If your course is still locked, sign in again from your dashboard and it will appear.';
        actions.innerHTML = dashLink();
      }
      function showFailed() {
        emblem.className = 'emblem bad'; emblem.innerHTML = '✕';
        title.textContent = 'Payment not completed';
        msg.textContent = 'It looks like the payment was cancelled or did not go through. No money was taken. You can try again from your dashboard.';
        actions.innerHTML = '<a class="btn alt" href="hub-dashboard.html">Back to Dashboard</a>';
      }

      // If Flutterwave says it failed/cancelled, show that immediately.
      if (status && status !== 'successful' && status !== 'completed') { showFailed(); return; }

      // Otherwise poll the cloud: the webhook grants access server-side, and
      // hydrateAccountFromCloud pulls it down to this device.
      var tries = 0, maxTries = 6;
      function check() {
        tries++;
        var sess = (typeof HubDB !== 'undefined' && HubDB.studentSession) ? HubDB.studentSession() : null;
        function unlockedNow() {
          try { return itemId && HubDB.hasAccess && HubDB.hasAccess(itemId); } catch (e) { return false; }
        }
        var after = function () {
          if (unlockedNow()) { showSuccess(); return; }
          if (tries >= maxTries) { showPending(); return; }
          setTimeout(check, 3000);
        };
        if (sess && sess.id && typeof HubDB !== 'undefined' && HubDB.hydrateAccountFromCloud) {
          HubDB.hydrateAccountFromCloud(sess).then(after).catch(after);
        } else {
          // Not signed in on this device — can't auto-unlock here.
          if (tries >= maxTries) { showPending(); return; }
          setTimeout(check, 3000);
        }
      }
      check();
    })();
  </script>
</body>
</html>
