<html lang="en">
<head>

  <style>
:root{
  --exam-blue:#0B3D91;
  --exam-blue-d:#072a66;
  --exam-accent:#C8102E;
  --exam-green:#0B7A54;
  --exam-bg:#E8EDF5;
  --exam-panel:#FFFFFF;
  --exam-text:#1A2332;
  --exam-muted:#5A6A7E;
  --exam-border:#C5D0E0;
  --exam-flag:#F5A623;
  --exam-answered:#0B3D91;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--exam-bg);color:var(--exam-text);line-height:1.5;min-height:100vh}
button{font-family:inherit;cursor:pointer}
.hidden{display:none!important}
.exam-top{background:var(--exam-blue);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.55rem 1rem;gap:.75rem;position:sticky;top:0;z-index:50;box-shadow:0 2px 8px rgba(0,0,0,.18);min-height:48px}
.exam-top .left{display:flex;align-items:center;gap:.75rem;min-width:0}
.exam-top .logo{font-family:Poppins,sans-serif;font-weight:800;font-size:.88rem;letter-spacing:.02em;white-space:nowrap}
.exam-top .logo em{font-style:normal;opacity:.7;font-weight:600}
.exam-top .sec-label{font-size:.78rem;font-weight:600;background:rgba(255,255,255,.15);padding:.25rem .65rem;border-radius:4px;white-space:nowrap}
.exam-top .q-count{font-size:.85rem;font-weight:600;opacity:.95}
.exam-top .right{display:flex;align-items:center;gap:.6rem}
.exam-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:1rem;background:rgba(0,0,0,.25);padding:.3rem .75rem;border-radius:4px;min-width:4.2rem;text-align:center}
.exam-timer.warn{background:#C8102E;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.75}}
.wrap{max-width:880px;margin:0 auto;padding:1.25rem 1rem 5rem}
.panel{background:var(--exam-panel);border:1px solid var(--exam-border);border-radius:8px;padding:1.35rem 1.4rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(11,61,145,.06)}
.eyebrow{font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--exam-accent)}
h1.title{font-family:Poppins,sans-serif;font-size:clamp(1.25rem,3.5vw,1.75rem);color:var(--exam-blue);margin:.25rem 0 .5rem}
.lead{color:var(--exam-muted);font-size:.92rem;margin-bottom:.9rem}
.sec-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.65rem;margin:1rem 0}
.sec-card{border:1.5px solid var(--exam-border);border-radius:8px;padding:.9rem;background:#fff;text-align:center;cursor:pointer;transition:.12s;font-family:inherit;color:var(--exam-text)}
.sec-card:hover{border-color:var(--exam-blue);box-shadow:0 3px 12px rgba(11,61,145,.12)}
.sec-card.full{border-color:var(--exam-accent);background:linear-gradient(180deg,#fff8f8,#fff)}
.sec-card h4{font-family:Poppins,sans-serif;font-size:.95rem;color:var(--exam-blue);margin:0 0 .2rem}
.sec-card.full h4{color:var(--exam-accent)}
.sec-card p{font-size:.75rem;color:var(--exam-muted);margin:0;line-height:1.35}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.35rem;border:none;border-radius:6px;font-weight:700;font-size:.9rem;padding:.7rem 1.25rem;min-height:44px;text-decoration:none}
.btn-primary{background:var(--exam-blue);color:#fff}
.btn-primary:hover{background:var(--exam-blue-d)}
.btn-accent{background:var(--exam-accent);color:#fff}
.btn-line{background:#fff;border:1.5px solid var(--exam-border);color:var(--exam-text)}
.btn-sm{padding:.45rem .85rem;min-height:36px;font-size:.82rem}
.meta-row{font-size:.88rem;color:var(--exam-muted);margin:.6rem 0 1rem}
#testView{padding-bottom:70px}
.q-panel{background:var(--exam-panel);border:1px solid var(--exam-border);border-radius:8px;padding:1.25rem 1.35rem;margin-bottom:1rem;box-shadow:0 1px 4px rgba(11,61,145,.06)}
.q-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:.85rem;padding-bottom:.6rem;border-bottom:1px solid var(--exam-border)}
.q-head .qn{font-weight:700;color:var(--exam-blue);font-size:.95rem}
.q-head .sec-tag{font-size:.75rem;color:var(--exam-muted);font-weight:600}
.q-stem{font-size:1rem;font-weight:500;margin-bottom:1rem;line-height:1.55;white-space:pre-wrap}
.opt{display:flex;align-items:flex-start;gap:.7rem;padding:.7rem .85rem;margin:.35rem 0;border:1.5px solid var(--exam-border);border-radius:6px;cursor:pointer;transition:.1s;background:#fff}
.opt:hover{background:#F0F4FA;border-color:#9BB0D0}
.opt.selected{border-color:var(--exam-blue);background:#E8F0FE}
.opt .letter{flex:none;width:26px;height:26px;border-radius:50%;background:#E8EDF5;color:var(--exam-blue);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center}
.opt.selected .letter{background:var(--exam-blue);color:#fff}
.opt .txt{flex:1;font-size:.95rem;padding-top:.15rem}
.exam-bottom{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#fff;border-top:2px solid var(--exam-blue);padding:.5rem .75rem;display:flex;align-items:center;justify-content:space-between;gap:.5rem;box-shadow:0 -2px 10px rgba(0,0,0,.08)}
.exam-bottom .nav-btns{display:flex;gap:.4rem;flex-wrap:wrap;flex:1;justify-content:center;max-height:72px;overflow-y:auto}
.nav-btn{width:34px;height:34px;border-radius:4px;border:1.5px solid var(--exam-border);background:#fff;font-weight:700;font-size:.8rem;color:var(--exam-muted);display:inline-flex;align-items:center;justify-content:center}
.nav-btn.current{border-color:var(--exam-blue);background:var(--exam-blue);color:#fff}
.nav-btn.answered{background:#D6E4F7;border-color:var(--exam-blue);color:var(--exam-blue)}
.nav-btn.flagged{border-color:var(--exam-flag);background:#FFF8E7;color:#B87A00}
.nav-btn.answered.flagged{background:#FFF8E7;border-color:var(--exam-flag)}
.exam-bottom .controls{display:flex;gap:.4rem;flex-shrink:0}
.ctrl-btn{border:1.5px solid var(--exam-border);background:#fff;border-radius:5px;padding:.45rem .75rem;font-weight:700;font-size:.82rem;color:var(--exam-text);min-height:36px}
.ctrl-btn.flag{border-color:var(--exam-flag);color:#B87A00}
.ctrl-btn.flag.on{background:var(--exam-flag);color:#fff;border-color:var(--exam-flag)}
.ctrl-btn.next{background:var(--exam-blue);color:#fff;border-color:var(--exam-blue)}
.ctrl-btn.submit{background:var(--exam-accent);color:#fff;border-color:var(--exam-accent)}
.review-grid{display:flex;flex-wrap:wrap;gap:.4rem;margin:1rem 0}
.review-cell{width:40px;height:40px;border-radius:5px;border:1.5px solid var(--exam-border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;background:#fff;cursor:pointer}
.review-cell.answered{background:#D6E4F7;border-color:var(--exam-blue);color:var(--exam-blue)}
.review-cell.flagged{background:#FFF8E7;border-color:var(--exam-flag);color:#B87A00}
.review-cell.unanswered{background:#FEE2E2;border-color:#F87171;color:#B91C1C}
.legend{display:flex;gap:1rem;flex-wrap:wrap;font-size:.8rem;color:var(--exam-muted);margin:.5rem 0 1rem}
.legend span{display:flex;align-items:center;gap:.3rem}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block;border:1px solid}
.score-hero{background:var(--exam-blue);color:#fff;border-radius:8px;padding:1.5rem;text-align:center;margin-bottom:1rem}
.score-hero .big{font-family:Poppins,sans-serif;font-size:2.4rem;font-weight:800}
.score-hero .lbl{opacity:.85;font-size:.9rem;margin-top:.25rem}
.rev-item{padding:.75rem;border-radius:6px;margin-bottom:.5rem;font-size:.9rem}
.rev-item.ok{background:#ECFDF5;border-left:3px solid var(--exam-green)}
.rev-item.bad{background:#FEF2F2;border-left:3px solid var(--exam-accent)}
.exp{font-size:.82rem;color:var(--exam-muted);margin-top:.35rem}
.prompt-box{border:1px solid var(--exam-border);border-radius:8px;padding:1rem;margin-bottom:.85rem;background:#FAFBFD}
.prompt-box .p-q{font-weight:600;margin-bottom:.5rem;white-space:pre-wrap}
.tips{font-size:.85rem;color:var(--exam-blue);margin:.4rem 0}
.check{font-size:.85rem;margin:.2rem 0;padding-left:1.2rem;position:relative}
.check::before{content:"✓";position:absolute;left:0;color:var(--exam-green);font-weight:800}
.reveal-btn{background:#E8EDF5;color:var(--exam-blue);border:none;border-radius:5px;padding:.45rem .8rem;font-weight:700;font-size:.82rem;margin-top:.5rem}
.model{display:none;margin-top:.6rem;background:#F0F7F4;border:1px dashed var(--exam-green);border-radius:6px;padding:.85rem;font-size:.9rem;white-space:pre-wrap;line-height:1.55}
.model.show{display:block}
.exam-passage{margin-bottom:.75rem}
.exam-table{width:100%;border-collapse:collapse;margin:.75rem 0;font-size:.9rem;background:#fff}
.exam-table th,.exam-table td{border:1px solid #C5D0E0;padding:.45rem .65rem;text-align:center}
.exam-table th{background:#0B3D91;color:#fff;font-weight:700}
.exam-table tr:nth-child(even) td{background:#F0F4FA}
.exam-chart{margin:.75rem 0;text-align:center}
.q-html .q-stem,.q-html{line-height:1.5}
.q-html p{margin:.4rem 0}
@media(max-width:600px){.exam-top .sec-label{display:none}.exam-bottom{flex-wrap:wrap}.exam-bottom .nav-btns{order:3;width:100%;justify-content:flex-start;max-height:48px}}
  </style>
</head>
<body>
<div class="exam-top" id="examTop">
  <div class="left">
    <span class="logo">TIH <em>Exam</em></span>
    <span class="sec-label" id="topSecLabel">Practice Test</span>
    <span class="q-count" id="topQCount"></span>
  </div>
  <div class="right">
    <span class="exam-timer" id="timer" style="display:none">00:00</span>
  </div>
</div>
<div class="wrap">
  <div id="introView">
    <div class="panel">
      <p class="eyebrow" id="examEyebrow">Practice Test</p>
      <h1 class="title" id="examTitle">Loading…</h1>
      <p class="lead" id="examIntro"></p>
      <div class="meta-row" id="metaRow" style="display:none"></div>
      <div id="sectionPicker"></div>
      <button class="btn btn-primary hidden" id="startBtn">Start section →</button>
      <div id="selfCheckView" class="hidden"></div>
      <div style="margin-top:1.1rem;display:flex;gap:.5rem;flex-wrap:wrap">
        <a class="btn btn-line btn-sm" id="backCourseBtn" href="#">← Back to Course</a>
      </div>
    </div>
  </div>
  <div id="testView" class="hidden">
    <div class="q-panel">
      <div class="q-head">
        <span class="qn" id="qProgress">Question 1</span>
        <span class="sec-tag" id="qSecTag"></span>
      </div>
      <div id="questionArea"></div>
    </div>
  </div>
  <div id="reviewView" class="hidden">
    <div class="panel">
      <h2 style="font-family:Poppins,sans-serif;color:var(--exam-blue);font-size:1.2rem;margin-bottom:.4rem">Review your answers</h2>
      <p style="color:var(--exam-muted);font-size:.9rem;margin-bottom:.6rem">Check unanswered or flagged questions before submitting. Click a number to jump back.</p>
      <div class="legend">
        <span><i style="background:#D6E4F7;border-color:var(--exam-blue)"></i> Answered</span>
        <span><i style="background:#FFF8E7;border-color:var(--exam-flag)"></i> Flagged</span>
        <span><i style="background:#FEE2E2;border-color:#F87171"></i> Unanswered</span>
      </div>
      <div class="review-grid" id="reviewGrid"></div>
      <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem">
        <button class="btn btn-line" id="backToTestBtn">← Back to questions</button>
        <button class="btn btn-accent" id="finalSubmitBtn">Submit final answers</button>
      </div>
    </div>
  </div>
  <div id="resultView" class="hidden">
    <div class="score-hero">
      <div class="big" id="scoreBig">—</div>
      <div class="lbl" id="scoreDetail"></div>
    </div>
    <div class="panel">
      <h3 style="font-family:Poppins,sans-serif;color:var(--exam-blue);margin-bottom:.8rem">Answer Review</h3>
      <div id="reviewList"></div>
      <div style="margin-top:1.2rem;display:flex;gap:.5rem;flex-wrap:wrap">
        <button class="btn btn-primary" id="retakeBtn">Retake</button>
        <a class="btn btn-line btn-sm" id="backSectionsBtn" href="#">← All sections</a>
        <a class="btn btn-line btn-sm" id="backCourseBtn2" href="#">← Back to Course</a>
      </div>
    </div>
    <div class="panel" id="extrasResult"></div>
  </div>
</div>
<div class="exam-bottom hidden" id="examBottom">
  <div class="controls">
    <button class="ctrl-btn" id="prevBtn">← Back</button>
  </div>
  <div class="nav-btns" id="navGrid"></div>
  <div class="controls">
    <button class="ctrl-btn flag" id="flagBtn">⚑ Flag</button>
    <button class="ctrl-btn next" id="nextBtn">Next →</button>
    <button class="ctrl-btn submit hidden" id="submitBtn">Review</button>
  </div>
</div>
<script src="practice-test-app.js?v=3"></script>
</body>
</html>
