<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Practice Test | TIH Learning Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="courses-db.js?v=21"></script>
  <script src="hub-config.js?v=4"></script>
  <script src="hub-cloud.js?v=16"></script>
  <script src="hub-db.js?v=38"></script>
  <script src="hub-pay.js?v=1"></script>
  <script src="paywall.js?v=10"></script>
  <script src="ielts-listening-q.js?v=1"></script>
  <script src="ielts-reading-q.js?v=1"></script>
  <script src="ielts-grammar-q.js?v=1"></script>
  <script src="ielts-writing-q.js?v=1"></script>
  <script src="ielts-speaking-q.js?v=1"></script>
  <script src="toefl-bank.js?v=1"></script>
  <script src="sat-bank.js?v=1"></script>
  <script src="practice-tests.js?v=5"></script>
  <link rel="stylesheet" href="styles.css?v=40" />
  <style>
    :root{--navy:#0f2a5f;--teal:#0d9488;--muted:#64748b;--card:#fff;--bg:#f8fafc;}
    body{font-family:Inter,system-ui,sans-serif;background:var(--bg);margin:0;color:#1e293b;}
    .wrap{max-width:900px;margin:0 auto;padding:1.25rem;}
    .card{background:var(--card);border-radius:14px;box-shadow:0 4px 20px rgba(15,42,95,.08);padding:1.25rem;margin-bottom:1rem;}
    .btn{display:inline-flex;align-items:center;gap:.4rem;padding:.65rem 1.2rem;border-radius:10px;font-weight:600;border:none;cursor:pointer;font-size:.95rem;text-decoration:none;}
    .btn-primary{background:var(--teal);color:#fff;}
    .btn-line{background:transparent;border:1.5px solid #cbd5e1;color:var(--navy);}
    .btn-sm{padding:.4rem .8rem;font-size:.85rem;}
    .hidden{display:none!important;}
    #sectionPicker{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:.75rem;margin:1rem 0;}
    .sec-card{background:#eef2fb;border:2px solid transparent;border-radius:12px;padding:1rem;cursor:pointer;text-align:center;transition:.15s;}
    .sec-card:hover{border-color:var(--teal);background:#e0f2f1;}
    .sec-card h4{margin:0 0 .25rem;color:var(--navy);font-size:1rem;}
    .sec-card p{margin:0;font-size:.8rem;color:var(--muted);}
    #timer{font-weight:700;color:var(--teal);}
    .q-card{margin-bottom:1.25rem;}
    .opt{display:flex;align-items:flex-start;gap:.6rem;padding:.55rem .75rem;border-radius:8px;cursor:pointer;margin:.3rem 0;border:1.5px solid #e2e8f0;}
    .opt:hover{background:#f1f5f9;}
    .opt.selected{border-color:var(--teal);background:#e0f2f1;}
    .opt .letter{flex:none;width:24px;height:24px;border-radius:50%;background:#eef2fb;color:var(--navy);font-weight:800;font-size:.8rem;display:flex;align-items:center;justify-content:center;}
    #navGrid{display:flex;flex-wrap:wrap;gap:.35rem;}
    .nav-btn{width:36px;height:36px;border-radius:8px;border:1.5px solid #cbd5e1;background:#fff;cursor:pointer;font-weight:600;}
    .nav-btn.current{border-color:var(--teal);background:var(--teal);color:#fff;}
    .nav-btn.answered{background:#e0f2f1;border-color:#99f6e4;}
    .nav-btn.flagged{background:#fef3c7;border-color:#fbbf24;}
    .prompt-box{background:#f8fafc;border-radius:10px;padding:1rem;margin:1rem 0;border-left:4px solid var(--teal);}
    .model{display:none;margin-top:.75rem;padding:.75rem;background:#f0fdf4;border-radius:8px;font-size:.9rem;white-space:pre-wrap;}
    .model.show{display:block;}
    .reveal-btn{background:#eef2fb;border:none;padding:.4rem .8rem;border-radius:6px;cursor:pointer;font-size:.85rem;color:var(--navy);font-weight:600;}
    .check{font-size:.85rem;color:var(--muted);margin:.2rem 0;}
    .tips{font-size:.85rem;color:#0d9488;margin:.4rem 0;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="introView">
      <div style="font-size:.8rem;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;" id="examEyebrow">Practice Test</div>
      <h1 id="examTitle" style="color:var(--navy);margin:.3rem 0 .5rem;font-family:Poppins,sans-serif;">Loading…</h1>
      <p id="examIntro" style="color:var(--muted);margin-bottom:1rem;"></p>
      <div id="sectionPicker"></div>
      <div id="metaRow" style="display:none;margin:1rem 0;font-size:.9rem;color:var(--muted);"></div>
      <button class="btn btn-primary" id="startBtn" style="display:none;">Start Test</button>
      <div id="selfCheckView" class="hidden"></div>
      <div id="extrasIntro" class="hidden"></div>
      <div style="margin-top:1.25rem;display:flex;gap:.5rem;flex-wrap:wrap;">
        <a class="btn btn-line btn-sm" id="backCourseBtn" href="#">← Back to Course</a>
      </div>
    </div>

    <div id="testView" class="hidden">
      <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;">
        <div><strong id="qProgress">Q 1</strong> · <span id="timer">00:00</span></div>
        <div style="display:flex;gap:.4rem;">
          <button class="btn btn-line btn-sm" id="flagBtn">⚑ Flag</button>
          <button class="btn btn-primary btn-sm" id="submitBtn">Submit</button>
        </div>
      </div>
      <div class="card" id="questionArea"></div>
      <div class="card">
        <div id="navGrid"></div>
        <div style="margin-top:.75rem;display:flex;gap:.5rem;">
          <button class="btn btn-line btn-sm" id="prevBtn">← Prev</button>
          <button class="btn btn-line btn-sm" id="nextBtn">Next →</button>
        </div>
      </div>
    </div>

    <div id="resultView" class="hidden">
      <div class="card">
        <h2 style="color:var(--navy);font-family:Poppins,sans-serif;" id="scoreBig">—</h2>
        <p id="scoreDetail" style="color:var(--muted);"></p>
        <div style="margin-top:1rem;display:flex;gap:.5rem;flex-wrap:wrap;">
          <button class="btn btn-primary" id="retakeBtn">Retake</button>
          <a class="btn btn-line btn-sm" id="backSectionsBtn" href="#">← All sections</a>
          <a class="btn btn-line btn-sm" id="backCourseBtn2" href="#">← Back to Course</a>
        </div>
      </div>
      <div class="card">
        <h3 style="color:var(--navy);margin-bottom:.8rem;">Answer Review</h3>
        <div id="reviewList"></div>
      </div>
      <div class="card" id="extrasResult"></div>
    </div>
  </div>

  <script src="practice-test-app.js?v=1"></script>
  <script>
    (function () {
      function show() {
        try {
          var r = document.querySelectorAll('.reveal');
          for (var i = 0; i < r.length; i++) r[i].classList.add('visible');
        } catch (e) {}
      }
      window.addEventListener('load', function () { setTimeout(show, 1200); });
      setTimeout(show, 4000);
    })();
  </script>
</body>
</html>
